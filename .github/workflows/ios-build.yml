# iOS build on a cloud Mac — no local macOS needed.
# Runs on every push to main and on demand (Actions tab → "iOS Build" → Run workflow).
#
# What this proves: the web game builds, Capacitor syncs, and the Xcode project
# compiles for a real iOS target. Signing/App Store upload requires an Apple
# Developer account ($99/year) and adding certificates as repository secrets —
# see docs/DEPLOYMENT.md for how to extend this once enrolled.
name: iOS Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - 'ios/**'
      - 'android/app/src/main/java/**'
      - 'vitest.config.ts'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Verify native party TLS identity and certificate pinning
        run: |
          mkdir -p "$RUNNER_TEMP/party-tls-java"
          javac -d "$RUNNER_TEMP/party-tls-java" android/app/src/main/java/com/fireboydroid/redflagrush/LanTls.java android/app/src/main/java/com/fireboydroid/redflagrush/LanSocketServer.java scripts/PartyTlsInterop.java
          keytool -genkeypair -alias room -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -dname 'CN=Temporary Party Test' -validity 1 -storetype PKCS12 -keystore "$RUNNER_TEMP/party-test.p12" -storepass temporary-test-only -noprompt
          swiftc ios/App/App/PartyTLSIdentity.swift scripts/ios-party-tls-check.swift -o "$RUNNER_TEMP/party-tls-check"
          "$RUNNER_TEMP/party-tls-check" "$RUNNER_TEMP/party-tls-java" "$RUNNER_TEMP/party-test.p12"

      - name: Build web app and sync iOS project
        run: npm run mobile:sync:ios

      - name: Compile iOS app (unsigned)
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: red-flag-rush-ios-unsigned
          path: ios/DerivedData/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error
          retention-days: 14
