# iOS build on a cloud Mac — no local macOS needed.
# Runs on every push to main and on demand (Actions tab → "iOS Build" → Run workflow).
#
# What this proves: the web game builds, Capacitor syncs, and the Xcode project
# compiles for a real iOS target. Signing/App Store upload requires an Apple
# Developer account ($99/year) and adding certificates as repository secrets —
# see docs/DEPLOYMENT.md for how to extend this once enrolled.
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run typecheck && npx vitest run src

      - name: Build web app and sync iOS project
        run: npm run mobile:sync:ios

      - name: Compile iOS app (unsigned)
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: red-flag-rush-ios-unsigned
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
          retention-days: 14
