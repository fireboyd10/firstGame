// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Windows keeps output outside OneDrive; other platforms use ignored local output.
    // Override with -PbuildRoot=/absolute/path when needed.
    def buildRoot = project.findProperty('buildRoot') ?: (System.getenv('LOCALAPPDATA')
        ? "${System.getenv('LOCALAPPDATA')}/red-flag-rush-build"
        : rootProject.file('build').absolutePath)
    buildDir = "${buildRoot}/${project.name}"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
