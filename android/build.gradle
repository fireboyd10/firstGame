// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // This project lives in OneDrive, which locks build intermediates mid-sync.
    // Keep all Gradle output on local disk instead (gitignored regardless).
    // Override with -PbuildRoot=... if you prefer another location.
    def buildRoot = project.findProperty('buildRoot') ?: "${System.getenv('LOCALAPPDATA') ?: '/tmp'}/red-flag-rush-build"
    buildDir = "${buildRoot}/${project.name}"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
